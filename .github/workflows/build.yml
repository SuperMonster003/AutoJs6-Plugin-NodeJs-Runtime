name: Android build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      emulator_smoke:
        description: Run the API 36 x86_64 smoke suite after packaging
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: JVM tests (no native downloads)
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/

  package:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: ./.github/actions/restore-native
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build application and instrumentation APKs
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator:
    needs: package
    if: github.event_name != 'workflow_dispatch' || inputs.emulator_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2560M is the runner's default; kept as the memory-pressure canary (it caught the loader masking OOM).
          - api: 36
            target: google_apis
            page_size: 4096
            ram_size: 2560M
          # The 16 KB image ships ~470 MB of swap against ~1.9 GB on the 4 KB one; extra RAM makes up the headroom.
          - api: 35
            target: google_apis_ps16k
            page_size: 16384
            ram_size: 4096M
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/download-artifact@v8
        with:
          name: debug-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          EXPECTED_PAGE_SIZE: ${{ matrix.page_size }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: ${{ matrix.ram_size }}
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-results-${{ matrix.target }}
          path: smoke-*.txt
